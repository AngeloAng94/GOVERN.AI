[pytest]
# -ra: mostra SEMPRE nel report finale il riepilogo di tutti i test non-passed
#      (inclusi gli SKIPPED con la loro motivazione). Il badge non puo' piu'
#      risultare "verde" nascondendo test saltati.
# --strict-markers: fallisce se si usa un marker non registrato.
addopts = -ra --strict-markers
testpaths = tests
markers =
    llm: test che effettuano una chiamata LLM reale (path Performance / GPT-4o).
    sovereign: test che esercitano la Sovereign Mode (Apertus). SKIPPED in modo visibile quando PUBLICAI_API_KEY e' assente.
